<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zrugal Photo Editor</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <h1><img src="{{ url_for('static', filename='zjournal_logo.png') }}" alt="Zrugal" class="brand-logo"> Photo Editor</h1>
  <div class="topbar-actions">
    <label class="btn icon-btn" for="fileInput" title="Upload photo" aria-label="Upload photo">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><polyline points="7 8 12 3 17 8"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    </label>
    <input id="fileInput" type="file" accept="image/*" hidden>
    <button id="resetBtn" class="btn icon-btn secondary" title="Reset" aria-label="Reset" disabled>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 3 3 9 9 9"/><path d="M3 9a9 9 0 1 1 2.6 8.4"/></svg>
    </button>
    <button id="saveBtn" class="btn icon-btn primary" title="Save to project" aria-label="Save to project" disabled>
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2Z"/><path d="M17 21v-8H7v8"/><path d="M7 3v5h8"/></svg>
    </button>
    <a id="downloadBtn" class="btn icon-btn" href="#" hidden title="Download" aria-label="Download">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><polyline points="7 10 12 15 17 10"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
    </a>
  </div>
</header>

<main class="layout">
  <section class="canvas-area">
    <div id="dropHint" class="drop-hint">Upload a photo to get started</div>
    <div id="imageWrap" class="image-wrap" hidden>
      <img id="preview" alt="preview">
      <span id="initialPreviewText" class="initial-preview-text" hidden>Upload an Image to get started</span>
      <div id="cropBox" class="crop-box" hidden>
        <span class="crop-handle handle-nw"></span>
        <span class="crop-handle handle-n"></span>
        <span class="crop-handle handle-ne"></span>
        <span class="crop-handle handle-e"></span>
        <span class="crop-handle handle-se"></span>
        <span class="crop-handle handle-s"></span>
        <span class="crop-handle handle-sw"></span>
        <span class="crop-handle handle-w"></span>
      </div>
    </div>
    <p id="status" class="status"></p>
  </section>

  <aside class="panel">
    <div class="accordion">
      <div class="accordion-item">
        <button class="accordion-header" type="button" aria-expanded="true">
          <span>Light</span>
          <span class="chevron">▾</span>
        </button>
        <div class="accordion-body">
          <label>Brightness <span data-out="brightness">1.00</span>
            <input type="range" id="brightness" min="0" max="2" step="0.01" value="1">
          </label>
          <label>Exposure <span data-out="exposure">1.00</span>
            <input type="range" id="exposure" min="0" max="2" step="0.01" value="1">
          </label>
          <label>Contrast <span data-out="contrast">1.00</span>
            <input type="range" id="contrast" min="0" max="2" step="0.01" value="1">
          </label>
          <label>Whites <span data-out="whites">1.00</span>
            <input type="range" id="whites" min="0" max="2" step="0.01" value="1">
          </label>
          <label>Blacks <span data-out="blacks">1.00</span>
            <input type="range" id="blacks" min="0" max="2" step="0.01" value="1">
          </label>
          <label>Shadows <span data-out="shadows">1.00</span>
            <input type="range" id="shadows" min="0" max="2" step="0.01" value="1">
          </label>
        </div>
      </div>

      <div class="accordion-item">
        <button class="accordion-header" type="button" aria-expanded="true">
          <span>Color balance</span>
          <span class="chevron">▾</span>
        </button>
        <div class="accordion-body">
          <label>Saturation <span data-out="saturation">1.00</span>
            <input type="range" id="saturation" min="0" max="2" step="0.01" value="1">
          </label>
          <label>Vibrance <span data-out="vibrance">1.00</span>
            <input type="range" id="vibrance" min="0" max="2" step="0.01" value="1">
          </label>
          <label>Red <span data-out="r">1.00</span>
            <input type="range" id="r" min="0" max="2" step="0.01" value="1">
          </label>
          <label>Green <span data-out="g">1.00</span>
            <input type="range" id="g" min="0" max="2" step="0.01" value="1">
          </label>
          <label>Blue <span data-out="b">1.00</span>
            <input type="range" id="b" min="0" max="2" step="0.01" value="1">
          </label>
        </div>
      </div>

      <div class="accordion-item open">
        <button class="accordion-header" type="button" aria-expanded="true">
          <span>Zoom</span>
          <span class="chevron">▾</span>
        </button>
        <div class="accordion-body">
          <div class="zoom-controls">
            <button id="zoomOutBtn" class="btn icon-btn secondary" type="button" title="Zoom out" aria-label="Zoom out">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
            </button>
            <button id="zoomInBtn" class="btn icon-btn secondary" type="button" title="Zoom in" aria-label="Zoom in">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
            </button>
            <button id="resetZoomBtn" class="btn icon-btn secondary" type="button" title="Reset zoom" aria-label="Reset zoom">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M16 3h3a2 2 0 0 1 2 2v3"/><path d="M8 21H5a2 2 0 0 1-2-2v-3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
            </button>
          </div>
          <div class="rotate-controls">
            <button id="rotateLeftBtn" class="btn icon-btn secondary" type="button" title="Rotate left" aria-label="Rotate left">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 2.6-6.4"/><polyline points="3 3 3 8 8 8"/></svg>
            </button>
            <button id="rotateRightBtn" class="btn icon-btn secondary" type="button" title="Rotate right" aria-label="Rotate right">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><polyline points="21 3 21 8 16 8"/></svg>
            </button>
          </div>
          <p class="hint zoom-level"><span id="zoomLevel">100%</span></p>
        </div>
      </div>

      <div class="accordion-item open">
        <button class="accordion-header" type="button" aria-expanded="true">
          <span>Crop</span>
          <span class="chevron">▾</span>
        </button>
        <div class="accordion-body">
          <div class="crop-mode-controls">
            <button id="cropDragBtn" class="btn icon-btn secondary active" type="button" title="Drag to pan" aria-label="Drag to pan">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v20M2 12h20"/><path d="M5 9L2 12l3 3M19 9l3 3-3 3M9 5l3-3 3 3M9 19l3 3 3-3"/></svg>
            </button>
            <button id="cropSelectBtn" class="btn icon-btn secondary" type="button" title="Select crop box" aria-label="Select crop box">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>
            </button>
          </div>
          <p class="hint">Use Drag to pan the zoomed image, or Select to draw a crop box.</p>
          <button id="applyCropBtn" class="btn icon-btn secondary" title="Apply crop" aria-label="Apply crop" disabled>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
          </button>
          <button id="clearCropBtn" class="btn icon-btn secondary" title="Clear crop" aria-label="Clear crop" disabled>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>

      <div class="accordion-item">
        <button class="accordion-header" type="button" aria-expanded="true">
          <span>Resize</span>
          <span class="chevron">▾</span>
        </button>
        <div class="accordion-body">
          <label class="inline">W <input type="number" id="resizeW" min="1"></label>
          <label class="inline">H <input type="number" id="resizeH" min="1"></label>
          <label class="checkbox"><input type="checkbox" id="lockAspect" checked> Lock aspect ratio</label>
          <label>Enhancement
            <select id="enhancement">
              <option value="none">None</option>
              <option value="clahe">CLAHE</option>
              <option value="filter2d">Filter2D</option>
              <option value="bilateral">Bilateral Filter</option>
              <option value="unsharp">Unsharp Mask</option>
              <option value="detail">Detail Enhance</option>
            </select>
          </label>
          <button id="applyResizeBtn" class="btn icon-btn secondary" title="Apply resize" aria-label="Apply resize" disabled>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
          </button>
        </div>
      </div>

      <div class="accordion-item">
        <button class="accordion-header" type="button" aria-expanded="true">
          <span>History</span>
          <span class="chevron">▾</span>
        </button>
        <div class="accordion-body">
          <p class="hint">Click a step to revert to it.</p>
          <ul id="historyList" class="history-list"></ul>
        </div>
      </div>
    </div>
  </aside>
</main>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
